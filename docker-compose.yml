version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    working_dir: /var/www
    volumes:
      - .:/var/www
      - /var/www/node_modules
      - /var/www/vendor
    ports:
      - "8000:8000"
      - "5173:5173"
    depends_on:
      - db
    networks:
      - app_network
    environment:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: >
      sh -c "
        echo 'Aguardando MySQL...';
        until nc -z db 3306; do
          sleep 2;
        done;
        echo 'Banco pronto!';

        php artisan migrate:fresh --seed;

        php artisan serve --host=0.0.0.0 --port=8000 &

        npm run dev -- --host
      "

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: open_library
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app_network

volumes:
  dbdata:

networks:
  app_network: